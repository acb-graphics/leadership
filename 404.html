<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-G57L4DKF4V"></script>
<script>
  // Consent management
  (function() {
    const consentKey = 'ab-analytics-consent';
    const consent = localStorage.getItem(consentKey);

    // Only load analytics if consent given
    if (consent === 'accepted') {
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-G57L4DKF4V');
    }

    // Show banner if no consent decision yet
    if (!consent) {
      document.addEventListener('DOMContentLoaded', function() {
        const banner = document.createElement('div');
        banner.id = 'consent-banner';
        banner.innerHTML = `
          <div style="background:#f5f5f5; border-top:1px solid #ddd; padding:16px 24px; text-align:center; font-size:14px; position:fixed; bottom:0; left:0; right:0; z-index:9999; display:flex; align-items:center; justify-content:center; gap:12px;">
            <span style="flex:1; color:#555;">This site uses Google Analytics to understand how visitors use it.</span>
            <button id="consent-accept" style="background:#333; color:#fff; border:none; padding:8px 16px; border-radius:4px; cursor:pointer; font-size:14px; font-weight:500;">Accept</button>
            <button id="consent-reject" style="background:#fff; color:#333; border:1px solid #ddd; padding:8px 16px; border-radius:4px; cursor:pointer; font-size:14px; font-weight:500;">Reject</button>
          </div>
        `;
        document.body.appendChild(banner);

        document.getElementById('consent-accept').addEventListener('click', function() {
          localStorage.setItem(consentKey, 'accepted');
          banner.remove();
          // Reload to load gtag
          location.reload();
        });

        document.getElementById('consent-reject').addEventListener('click', function() {
          localStorage.setItem(consentKey, 'rejected');
          banner.remove();
        });
      });
    }
  })();
</script>
